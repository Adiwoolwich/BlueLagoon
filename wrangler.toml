name = "bluelagune"
main = "worker.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[durable_objects]
bindings = [{ name = "VISITORS", class_name = "VisitorCounter" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VisitorCounter"]

[[send_email]]
name = "EMAIL"
destination_address = "woolwichvcc@gmail.com"
